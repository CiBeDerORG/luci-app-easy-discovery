  function toast(message){clearTimeout(toastTimer);$('toast').innerHTML=icon('check')+esc(message);$('toast').classList.add('visible');toastTimer=setTimeout(()=>$('toast').classList.remove('visible'),3200)}
  function setPage(page){state.page=page;render();}
  function render(){
    document.querySelectorAll('[data-page]').forEach(b=>{const on=b.dataset.page===state.page;b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1});
    $('view').setAttribute('aria-labelledby','tab-'+state.page);
    $('env-dot').style.background=adbReady()?'#44ad88':'#dfb15a';
    const p=state.page, scanning=state.scanning[p];
    if(p==='devices'||p==='adb') $('title-actions').innerHTML=`<button class="btn" data-action="refresh-list">${icon('refresh','small')}刷新列表</button><button class="btn primary" data-action="scan" ${scanning||(p==='adb'&&!adbReady())?'disabled':''}>${icon(scanning?'refresh':'discover','small '+(scanning?'spin':''))}${scanning?'正在发现…':p==='adb'?'立即发现 ADB':'立即发现设备'}</button>`;
    else if(p==='environment')$('title-actions').innerHTML=`<button class="btn" data-action="refresh-env">${icon('refresh','small')}刷新组件状态</button>`;
    else $('title-actions').innerHTML=`<button class="btn" data-action="api-example">${icon('code','small')}查看接口示例</button>`;
    if(p==='devices') renderDevices();else if(p==='adb')renderADB();else if(p==='environment')renderEnvironment();else renderAuth();
  }
  function renderDevices(){
    $('view').innerHTML=`<div class="stats">${stat('已发现设备','8','台','当前快照中的设备记录','network')}${stat('本次发现','6','台','<i class="dot green"></i>另有 2 条历史记录','activity','green')}${stat('ADB 端点','4','个','关联 3 台设备','terminal','purple')}${stat('网络范围','2','个','主网络 / 访客网络','wifi','orange')}</div><div class="snapshot-line"><span>${icon('clock')}上次发现：今天 ${state.lastScan.devices} <span style="margin:0 5px;color:#d2d9e3">|</span> 当前显示已保存的发现结果</span><span>手动发现 · 按需更新</span></div>${state.scanning.devices?notice('正在演示设备发现流程，完成前保留上次结果。'):''}<div class="card"><div class="card-head"><div><h2 class="card-title">设备列表<span class="count-tag">8</span></h2><p class="card-description">设备名称、地址与身份信息，集中查看。</p></div><div class="tools"><label class="search">${icon('search')}<input id="device-search" aria-label="搜索设备" placeholder="搜索名称、IP 或 MAC 地址" value="${esc(state.query)}"></label><select id="scope-filter" class="filter" aria-label="网络范围"><option value="all">全部网络</option><option value="lan">主网络 · LAN</option><option value="guest">访客网络</option></select><select id="status-filter" class="filter" aria-label="发现状态"><option value="all">全部记录</option><option value="current">本次发现</option><option value="history">历史记录</option></select><button class="btn icon-only" data-action="export" title="导出当前设备列表" aria-label="导出当前设备列表">${icon('download','small')}</button></div></div>${state.scanning.devices?'<div class="scan-progress"></div>':''}<div class="table-wrap"><table class="device-table"><thead><tr><th>设备名称</th><th>内网 IP</th><th>MAC 地址</th><th>厂商</th><th>设备型号</th><th>发现状态</th><th>最后发现</th><th>操作</th></tr></thead><tbody id="device-rows"></tbody></table></div><div class="table-footer"><span id="device-count"></span><div class="table-footer-right"><span>每页 10 条</span><span class="page-number">1</span></div></div></div><div class="under-note">${icon('info')}<span>型号来自设备上报或已授权的 ADB 信息；未提供时显示“未识别”。发现记录与 DHCP 租约不代表设备持续在线。</span></div>`;
    $('scope-filter').value=state.scope;$('status-filter').value=state.status;renderDeviceRows();
  }
  function filteredDevices(){const q=state.query.trim().toLowerCase();return devices.filter(d=>(state.scope==='all'||d.network===state.scope)&&(state.status==='all'||d.current===(state.status==='current'))&&(!q||[d.name,d.host,d.ip,d.v6,d.mac,d.vendor,d.model].some(v=>v.toLowerCase().includes(q))))}
  function renderDeviceRows(){const rows=filteredDevices();$('device-rows').innerHTML=rows.length?rows.map(d=>`<tr><td><div class="device-name">${deviceIcon(d)}<div><strong>${d.name}${d.adb?'<span class="mini-tag">ADB</span>':''}</strong><div class="sub">${d.connection}</div></div></div></td><td><div class="device-ip mono">${d.ip}</div><div class="sub" style="font-size:9px">${d.network==='lan'?'LAN':'Guest'}${d.v6?' · +1 IPv6':''}</div></td><td class="mono mac">${d.mac}</td><td>${d.vendor}</td><td class="model ${d.model?'':'unknown'}">${d.model||'未识别'}</td><td>${badge(d.current?'本次发现':'历史记录',d.current?'green':'')}</td><td class="mono" style="font-size:10px;color:#95a1b5">${d.seen}</td><td><button class="text-btn" style="font-size:11px" data-action="device-detail" data-id="${d.id}">详情${icon('chevron','small')}</button></td></tr>`).join(''):`<tr><td colspan="8" class="empty"><div class="empty-icon">${icon('search','large')}</div><h3>没有匹配的设备</h3><p>试试其他名称、IP 地址，或调整筛选条件。</p><button class="btn sm" data-action="clear-filters">清空筛选</button></td></tr>`;$('device-count').innerHTML=`显示 <b>${rows.length}</b> 条，共 <b>${devices.length}</b> 条发现记录`}
  function renderADB(){
    const ready=adbReady();
    $('view').innerHTML=`${notice(ready?'<strong>ADB 发现已就绪</strong><span style="margin:0 10px;opacity:.4">|</span>Avahi 与 D-Bus 服务运行中。':'<strong>ADB 发现暂不可用</strong><span style="margin:0 10px;opacity:.4">|</span>请安装并启动所需组件；仍可查看历史快照。',ready?'green':'amber','<button class="text-btn right" data-action="open-services">管理运行环境'+icon('chevron','small')+'</button>')}<div class="stats">${stat('发现的 ADB 端点','4','个','无线调试连接服务','terminal','purple')}${stat('关联设备','3','台','同一设备可有多个端点','phone')}${stat('网络协议','2','种','IPv4 / IPv6','network','green')}${stat('发现窗口','8','秒','仅在主动发现时执行','clock','orange')}</div><div class="snapshot-line"><span>${icon('clock')}上次发现：今天 ${state.lastScan.adb} <span style="margin:0 5px;color:#d2d9e3">|</span> 刷新列表只读取最近一次快照</span><span>服务类型：_adb-tls-connect._tcp</span></div>${state.scanning.adb?notice('正在演示 ADB 发现流程，已有端点会保留到本次发现结束。'):''}<div class="card"><div class="card-head"><div><h2 class="card-title">无线 ADB 端点<span class="count-tag">4</span></h2><p class="card-description">供 EasyADB 等客户端建立无线调试连接。</p></div><div class="tools"><label class="search">${icon('search')}<input id="adb-search" aria-label="搜索 ADB 端点" placeholder="搜索设备名称或端点地址" value="${esc(state.adbQuery)}"></label><select id="adb-protocol" class="filter" aria-label="ADB 网络协议"><option value="all">全部协议</option><option value="IPv4">IPv4</option><option value="IPv6">IPv6</option></select></div></div>${state.scanning.adb?'<div class="scan-progress"></div>':''}<div class="table-wrap"><table style="min-width:850px"><thead><tr><th>ADB 服务实例</th><th>端点地址</th><th>端口</th><th>协议</th><th>网络接口</th><th>关联设备</th><th>操作</th></tr></thead><tbody id="adb-rows"></tbody></table></div><div class="table-footer"><span id="adb-count"></span><span>连接与设备控制在 EasyADB 中完成</span></div></div><div class="under-note">${icon('info')}<span>同一手机可能同时广播 IPv4 和 IPv6 端点。发现端点不代表 ADB 已授权，也不等同于实际设备数量。</span></div>`;
    $('adb-protocol').value=state.adbProtocol;renderADBRows();
  }
  function endpointText(e){return `${e.protocol==='IPv6'?'['+e.address+']':e.address}:${e.port}`}
  function renderADBRows(){const q=state.adbQuery.toLowerCase().trim();const rows=endpoints.filter(e=>(state.adbProtocol==='all'||e.protocol===state.adbProtocol)&&(!q||[e.instance,e.address,devices.find(d=>d.id===e.device).name].some(v=>v.toLowerCase().includes(q))));$('adb-rows').innerHTML=rows.length?rows.map(e=>{const d=devices.find(d=>d.id===e.device);return `<tr><td><div class="device-name"><span class="device-icon">${icon('terminal')}</span><div><strong style="font-size:11px">${e.instance}</strong><div class="sub">无线调试连接</div></div></div></td><td class="mono" style="font-size:11px">${e.address}</td><td class="mono" style="font-size:11px">${e.port}</td><td><span class="badge ${e.protocol==='IPv6'?'blue':''}">${e.protocol}</span></td><td><span class="mono" style="font-size:10px">${e.iface}</span><div class="sub" style="font-size:9px">主网络 · LAN</div></td><td><button class="text-btn" style="font-size:11px" data-action="device-detail" data-id="${d.id}">${d.name}</button></td><td><button class="text-btn" style="font-size:11px" data-action="copy-endpoint" data-id="${e.id}" title="复制 IP:端口">${icon('copy','small')}复制</button></td></tr>`}).join(''):`<tr><td colspan="7" class="empty"><div class="empty-icon">${icon('terminal','large')}</div><h3>没有匹配的 ADB 端点</h3><p>调整关键词或协议筛选后再试。</p><button class="btn sm" data-action="clear-adb">清空筛选</button></td></tr>`;$('adb-count').innerHTML=`显示 <b>${rows.length}</b> 个端点 · 关联 <b>${new Set(rows.map(e=>e.device)).size}</b> 台设备`}
  function renderEnvironment(){
    const packages=state.environmentTab==='packages';
    $('view').innerHTML=`<div class="section-top"><div><h2>运行环境</h2><p>先准备发现组件，再按需开启相关服务。</p></div><span class="badge ${adbReady()?'green':'amber'}">${adbReady()?'发现能力已就绪':'部分能力待开启'}</span></div><div class="env-switch" role="tablist" aria-label="环境配置步骤"><button class="env-step ${packages?'active':''}" role="tab" aria-selected="${packages}" data-env="packages"><span class="step-number">01</span><span><strong>依赖安装</strong><small>安装、更新或移除软件组件</small></span>${icon('box')}</button><button class="env-step ${packages?'':'active'}" role="tab" aria-selected="${!packages}" data-env="services"><span class="step-number">02</span><span><strong>服务管理</strong><small>启动服务与设置开机自启</small></span>${icon('power')}</button></div>${packages?renderPackages():renderServices()}<div class="under-note">${icon('info')}<span>设备基础发现按需读取 DHCP、邻居等信息。Avahi 用于 mDNS / ADB 发现，依赖 D-Bus；ARP 扫描是可选增强。</span></div>`;
  }
  function renderPackages(){
    const requiredReady=state.installed.avahi&&state.installed.dbus;
    const entries=[{id:'avahi',icon:'discover',description:'发现局域网 mDNS 与无线 ADB 端点',packages:['avahi-dbus-daemon','avahi-utils'],optional:false},{id:'dbus',icon:'link',description:'为 Avahi 提供进程间通信支持',packages:['dbus'],optional:false},{id:'arp',icon:'network',description:'主动补充同一二层网络的 IPv4 设备',packages:['arp-scan'],optional:true}];
    return `${notice(requiredReady?'<strong>基础依赖已安装</strong> · 你可以前往服务管理，查看运行状态。':'<strong>ADB 依赖尚未齐全</strong> · 安装缺少的组件后，再开启相关服务。',requiredReady?'green':'amber')}<div class="card"><div class="card-head"><div><h3 class="card-title">依赖组件</h3><p class="card-description">安装状态与服务运行状态分别管理。</p></div>${!requiredReady?'<button class="btn primary sm" data-action="install-required">'+icon('download','small')+'安装必要依赖</button>':'<span class="badge">2 个必要组件 · 1 个可选组件</span>'}</div><div class="table-wrap"><table class="env-table"><thead><tr><th>组件</th><th>用途</th><th>安装状态</th><th>操作</th></tr></thead><tbody>${entries.map(e=>`<tr><td><div class="device-name"><span class="device-icon">${icon(e.icon)}</span><div><div class="env-title">${serviceNames[e.id]}${e.optional?'<span class="mini-tag">可选</span>':''}</div><div class="env-packages">${e.packages.map(p=>'<span class="code-tag">'+p+'</span>').join('')}</div></div></div></td><td>${e.description}</td><td>${badge(state.installed[e.id]?'已安装':'未安装',state.installed[e.id]?'green':'')}</td><td><div class="env-actions">${state.installed[e.id]?`<button class="btn sm" data-action="package-update" data-id="${e.id}">检查更新</button><button class="text-btn grey" data-action="package-remove" data-id="${e.id}">卸载</button>`:`<button class="btn primary sm" data-action="package-install" data-id="${e.id}">${icon('download','small')}安装</button>`}</div></td></tr>`).join('')}</tbody></table></div><div class="env-detail">${icon('box','small')}依赖安装完成后，可在「服务管理」中查看并启动服务。</div></div>`;
  }
  function renderServices(){return `${notice(adbReady()?'<strong>发现服务正常运行</strong> · Avahi 和 D-Bus 已启动，可主动发现 ADB。':'<strong>发现服务尚未全部开启</strong> · 请先确认依赖已安装，再启动所需服务。',adbReady()?'green':'amber')}<div class="card"><div class="card-head"><div><h3 class="card-title">后台服务</h3><p class="card-description">即时启动状态与开机自启分别控制。</p></div><span class="badge blue">运行中 ${Object.values(state.running).filter(Boolean).length} / 2</span></div><div class="table-wrap"><table class="env-table"><thead><tr><th>服务</th><th>运行状态</th><th>开机自启</th><th>服务控制</th></tr></thead><tbody>${['avahi','dbus'].map(id=>`<tr><td><div class="device-name"><span class="device-icon">${icon(id==='avahi'?'discover':'link')}</span><div><div class="env-title">${serviceNames[id]}</div><div class="sub">${id==='avahi'?'mDNS 与 ADB 服务发现':'Avahi 的通信依赖'}</div></div></div></td><td>${badge(!state.installed[id]?'未安装':state.running[id]?'运行中':'未运行',state.running[id]?'green':'')}</td><td><div class="switch-label"><button class="switch" role="switch" aria-label="${serviceNames[id]} 开机自启" aria-checked="${state.autostart[id]}" data-action="autostart" data-id="${id}" ${state.installed[id]?'':'disabled'}></button>${state.autostart[id]?'已开启':'已关闭'}</div></td><td><div class="env-actions">${state.running[id]?`<button class="btn sm" data-action="service-restart" data-id="${id}">${icon('refresh','small')}重启</button><button class="btn sm" data-action="service-toggle" data-id="${id}">停止</button>`:`<button class="btn primary sm" data-action="service-toggle" data-id="${id}" ${state.installed[id]?'':'disabled'}>${icon('power','small')}启动服务</button>`}</div></td></tr>`).join('')}</tbody></table></div><div class="env-detail">${icon('info','small')}停止 D-Bus 时会同时停止依赖它的 Avahi。主网络设备基础信息仍可查看。</div></div>`}
  function renderAuth(){const granted=permissions.filter(p=>state.permissions[p.id]);$('view').innerHTML=`<div class="section-top"><div><h2>接口授权</h2><p>为 EasyADB 或其他客户端配置发现能力的访问权限。</p></div><span class="badge blue">RPCD 会话认证</span></div><div class="auth-grid"><div class="card"><div class="card-head"><h3 class="card-title">${icon('key')}客户端授权</h3>${badge(state.authorized?'已授权':'未授权',state.authorized?'green':'')}</div><div class="auth-body"><dl class="credential-grid"><dt>接口地址</dt><dd>HTTPS · JSON-RPC<div class="copy-field"><code>https://192.168.31.1/ubus</code><button class="text-btn" data-action="copy-api" aria-label="复制接口地址">${icon('copy','small')}</button></div></dd><dt>专用账号</dt><dd><span class="mono">${state.authorized?'easyadb':'—'}</span></dd><dt>访问凭据</dt><dd>${state.authorized?'••••••••••••••••<div class="sub" style="font-size:10px">密钥仅在创建或重新生成时展示一次。</div>':'创建授权后生成专用密钥。'}</dd><dt>授权能力</dt><dd><div class="permission-chips">${state.authorized&&granted.length?granted.map(p=>'<span class="permission-chip">'+icon('check')+p.name+'</span>').join(''):'<span class="muted">暂无授权能力</span>'}</div></dd></dl><div class="auth-actions">${state.authorized?'<button class="btn sm" data-action="edit-permissions">'+icon('shield','small')+'编辑权限</button><button class="btn sm" data-action="rotate-key">'+icon('key','small')+'重新生成密钥</button><button class="text-btn red" data-action="revoke">撤销授权</button>':'<button class="btn primary" data-action="create-auth">'+icon('key','small')+'创建客户端授权</button>'}</div></div></div><aside class="card guide"><h3 class="guide-title">${icon('book')}如何接入</h3><div class="guide-steps"><div class="guide-step"><span class="guide-number">1</span><div><strong>创建专用授权</strong><p>选择客户端需要的发现权限，保存一次性显示的密钥。</p></div></div><div class="guide-step"><span class="guide-number">2</span><div><strong>填写连接信息</strong><p>在 EasyADB 或客户端中填写接口地址、账号与密钥。</p></div></div><div class="guide-step"><span class="guide-number">3</span><div><strong>登录后调用接口</strong><p>使用 RPCD 会话读取列表，或按需发起一次发现。</p></div></div></div><div class="guide-bottom">${icon('shield')}传输加密使用 HTTPS，访问范围由 ACL 控制。<br>外部账号的权限限定为设备与 ADB 发现。</div></aside></div><div class="card"><div class="card-head"><div><h3 class="card-title">对外发现接口</h3><p class="card-description">设备与 ADB 分别提供列表读取和主动发现。</p></div><button class="text-btn" data-action="api-example">调用示例${icon('chevron','small')}</button></div><div class="table-wrap"><table class="api-table"><thead><tr><th>接口能力</th><th>功能说明</th><th>授权状态</th><th>示例</th></tr></thead><tbody>${permissions.map(p=>`<tr><td><div class="api-name">${p.name}</div><div class="mono api-object">${p.object} · ${p.method}</div></td><td>${p.description}</td><td>${badge(state.authorized&&state.permissions[p.id]?'已授权':'未授权',state.authorized&&state.permissions[p.id]?'green':'')}</td><td><button class="text-btn" data-action="api-example" data-id="${p.id}">${icon('code','small')}查看</button></td></tr>`).join('')}</tbody></table></div></div><div class="under-note">${icon('info')}<span>本页展示授权界面与拟定接口；示例地址、密钥和调用数据仅供预览。</span></div>`}
  function showModal(title,body,foot=''){const m=$('modal');m.innerHTML=`<div class="dialog-head"><h2 id="modal-title">${title}</h2><button class="btn ghost icon-only" data-action="close-modal" aria-label="关闭弹窗">${icon('close')}</button></div><div class="dialog-body">${body}</div>${foot?'<div class="dialog-foot">'+foot+'</div>':''}`;if(!m.open)m.showModal()}
  function confirmAction(title,body,button,fn,danger=false){pendingAction=fn;showModal(title,body,`<button class="btn" data-action="close-modal">取消</button><button class="btn ${danger?'danger':'primary'}" data-action="confirm-action">${button}</button>`)}
  function deviceDetail(id){const d=devices.find(v=>v.id===id);if(!d)return;const eps=endpoints.filter(e=>e.device===id);$('drawer').innerHTML=`<div class="dialog-head"><h2 id="drawer-title">设备详情</h2><button class="btn ghost icon-only" data-action="close-drawer" aria-label="关闭设备详情">${icon('close')}</button></div><div class="dialog-body"><div class="detail-hero">${deviceIcon(d)}<div><h3>${d.name}</h3><div style="margin-top:6px">${badge(d.current?'本次发现':'历史记录',d.current?'green':'')}<span class="badge" style="margin-left:5px">${d.network==='lan'?'主网络 · LAN':'访客网络'}</span></div></div><div class="detail-heading">基本信息</div><dl class="detail-grid"><dt>主机名</dt><dd>${d.host}</dd><dt>设备厂商</dt><dd>${d.vendor}<div class="sub" style="font-size:10px">设备上报信息 · 示例</div></dd><dt>设备型号</dt><dd>${d.model||'未识别'}<div class="sub" style="font-size:10px">${d.modelSource}</div></dd><dt>最后发现</dt><dd>今天 ${d.seen}</dd></dl><div class="detail-section"><div class="detail-heading">网络信息</div><dl class="detail-grid"><dt>IPv4 地址</dt><dd class="mono">${d.ip}</dd><dt>IPv6 地址</dt><dd class="mono">${d.v6||'暂未发现'}</dd><dt>MAC 地址</dt><dd><span class="mono">${d.mac}</span><div class="sub" style="font-size:10px">本地管理地址 · 示例</div></dd><dt>网络接口</dt><dd class="mono">${d.iface}</dd><dt>连接方式</dt><dd>${d.connection}</dd></dl></div><div class="detail-section"><div class="detail-heading">信息来源</div><div class="detail-sources">${d.sources.map(s=>'<span class="source-chip">'+s+'</span>').join('')}</div><p class="sub" style="font-size:10px;margin-top:12px">同一网络范围内聚合地址和发现记录；来源信息保留以便核对。</p></div><div class="detail-section"><div class="detail-heading">关联 ADB 端点 · ${eps.length}</div>${eps.length?eps.map(e=>`<div class="endpoint-card"><div><span class="mono">${endpointText(e)}</span><div class="sub" style="font-size:9px">${e.protocol} · ${e.iface}</div></div><button class="text-btn" data-action="copy-endpoint" data-id="${e.id}" aria-label="复制 ${esc(endpointText(e))}">${icon('copy','small')}</button></div>`).join(''):'<p class="sub" style="font-size:11px">当前快照中没有关联的 ADB 端点。</p>'}</div></div><div class="dialog-foot"><button class="btn" data-action="copy-device" data-id="${d.id}">${icon('copy','small')}复制设备信息</button>${eps.length?'<button class="btn primary" data-action="view-device-adb" data-id="'+d.id+'">查看 ADB 端点</button>':'<button class="btn primary" data-action="close-drawer">完成</button>'}</div>`;$('drawer').showModal()}
  async function copyText(value){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(value);else{const a=document.createElement('textarea');a.value=value;a.style.position='fixed';a.style.opacity='0';const host=$('drawer').open?$('drawer'):$('modal').open?$('modal'):document.body;host.append(a);a.select();const ok=document.execCommand('copy');a.remove();if(!ok)throw new Error('copy unavailable')}toast('已复制到剪贴板')}catch{showModal('复制内容',`<p>可以选中下面的内容进行复制。</p><textarea aria-label="待复制内容" style="width:100%;height:120px;margin-top:12px;border:1px solid #dbe3f2;border-radius:6px;padding:12px;font:12px/1.8 monospace">${esc(value)}</textarea>`,'<button class="btn" data-action="close-modal">关闭</button>')}}
  function scan(){const page=state.page;if(!['devices','adb'].includes(page)||state.scanning[page])return;if(page==='adb'&&!adbReady()){toast('请先安装并启动 Avahi 和 D-Bus');return}state.scanning[page]=true;const generation=state.generation;render();setTimeout(()=>{if(state.generation!==generation)return;state.scanning[page]=false;state.lastScan[page]=now();if(page==='devices')devices.forEach(d=>{if(d.current)d.seen=state.lastScan.devices});render();toast(page==='adb'?'演示：发现 4 个 ADB 端点，关联 3 台设备':'演示：发现结果已更新，保留 2 条历史记录')},1700)}
  function permissionsForm(create=false){showModal(create?'创建客户端授权':'编辑访问权限',`<p>选择客户端可以使用的能力。</p>${permissions.map(p=>`<label class="check-row"><input type="checkbox" name="permission" value="${p.id}" ${state.permissions[p.id]?'checked':''}><span><strong>${p.name}</strong><small>${p.description}</small></span></label>`).join('')}<p class="sub" style="font-size:10px;margin-top:14px">服务控制、依赖安装与密钥管理使用管理员权限。</p>`,`<button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="save-permissions" data-create="${create}">${create?'生成示例凭据':'保存权限'}</button>`)}
  function showSecret(){const bytes=new Uint8Array(32);if(window.crypto&&window.crypto.getRandomValues)window.crypto.getRandomValues(bytes);else bytes.forEach((_,i)=>bytes[i]=(i*13+17)%256);const key=Array.from(bytes,v=>v.toString(16).padStart(2,'0')).join('');showModal('保存客户端密钥',`${notice('这是 <strong>演示凭据</strong>，不具备实际接口访问权限。','amber')}<p>账号：<strong class="mono">easyadb</strong></p><p>密钥仅在本次弹窗展示。关闭前可复制到客户端配置中。</p><div class="secret" id="demo-secret">${key}</div><button class="btn" data-action="copy-secret">${icon('copy','small')}复制示例密钥</button>`,'<button class="btn primary" data-action="close-modal">已保存，关闭</button>')}
  function apiExample(id='deviceList'){const p=permissions.find(v=>v.id===id)||permissions[0];const payload={jsonrpc:'2.0',id:1,method:'call',params:['<RPCD_SESSION>',p.object,p.method,{}]};const body=JSON.stringify(payload,null,2);showModal(p.name+' · 调用示例',`<p>接口地址：<span class="mono">https://192.168.31.1/ubus</span></p><p>客户端先使用专用账号登录 RPCD，再携带会话调用获得授权的能力。以下为拟定接口示例。</p><pre class="code-block" id="api-code">${esc(body)}</pre><p class="sub" style="font-size:10px;margin-top:14px">${p.method==='list'?'list 读取现有快照，不触发新发现。':'scan 发起一次有时间边界的主动发现。'} 此原型不会发出网络请求。</p>`,`<button class="btn" data-action="copy-api-code">${icon('copy','small')}复制示例</button><button class="btn primary" data-action="close-modal">了解</button>`)}
  function exportDevices(){const blob=new Blob([JSON.stringify({prototype:true,scanned_at:'示例 '+state.lastScan.devices,devices:filteredDevices()},null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='easy-discovery-demo-devices.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出当前筛选的示例设备列表')}
  document.addEventListener('click',event=>{
    const nav=event.target.closest('[data-page]');if(nav){setPage(nav.dataset.page);return}
    const env=event.target.closest('[data-env]');if(env){state.environmentTab=env.dataset.env;renderEnvironment();return}
    const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,id=b.dataset.id;
    if(a==='scan')scan();
    else if(a==='refresh-list')toast('演示：已读取最近一次快照，未触发新发现');
    else if(a==='refresh-env'){render();toast('演示：组件状态已刷新')}
    else if(a==='device-detail')deviceDetail(id);
    else if(a==='close-drawer')$('drawer').close();
    else if(a==='close-modal')$('modal').close();
    else if(a==='confirm-action'){const action=pendingAction;pendingAction=null;$('modal').close();if(action)action()}
    else if(a==='clear-filters'){state.query='';state.scope='all';state.status='all';renderDevices()}
    else if(a==='clear-adb'){state.adbQuery='';state.adbProtocol='all';renderADB()}
    else if(a==='copy-device'){const d=devices.find(d=>d.id===id);copyText(JSON.stringify(d,null,2))}
    else if(a==='copy-endpoint')copyText(endpointText(endpoints.find(e=>e.id===id)));
    else if(a==='view-device-adb'){state.adbQuery=devices.find(d=>d.id===id).name;state.adbProtocol='all';$('drawer').close();setPage('adb')}
    else if(a==='open-services'){state.environmentTab='services';setPage('environment')}
    else if(a==='package-update')toast('演示：'+serviceNames[id]+' 暂无可用更新');
    else if(a==='package-install'){state.installed[id]=true;render();toast('演示：'+serviceNames[id]+' 已安装'+(id==='arp'?'':'，可前往服务管理启动'))}
    else if(a==='install-required'){state.installed.avahi=state.installed.dbus=true;render();toast('演示：必要依赖已安装，服务运行状态未改变')}
    else if(a==='package-remove')confirmAction('卸载 '+serviceNames[id]+'？',`<p>${id==='dbus'?'D-Bus 卸载后，依赖它的 Avahi 也会停止。':id==='avahi'?'Avahi 卸载后，无线 ADB 发现暂时不可用。':'卸载后将使用基础发现来源，不再使用 ARP 扫描增强。'}</p><p>此操作仅改变本原型中的示例状态。</p>`,'确认卸载',()=>{state.installed[id]=false;if(id!=='arp'){state.running[id]=false;state.autostart[id]=false}if(id==='dbus')state.running.avahi=false;render();toast('演示：'+serviceNames[id]+' 已卸载')},true);
    else if(a==='autostart'){state.autostart[id]=!state.autostart[id];renderEnvironment();toast('演示：'+serviceNames[id]+' 开机自启已'+(state.autostart[id]?'开启':'关闭'))}
    else if(a==='service-restart')toast('演示：'+serviceNames[id]+' 已重启');
    else if(a==='service-toggle'){
      if(state.running[id]){confirmAction('停止 '+serviceNames[id]+' 服务？',`<p>${id==='dbus'?'D-Bus 停止时会同时停止 Avahi。':'停止后暂时无法发起新的 ADB 发现。'} 已保存的发现结果仍可查看。</p>`,'停止服务',()=>{state.running[id]=false;if(id==='dbus')state.running.avahi=false;render();toast('演示：相关服务已停止')})}
      else if(id==='avahi'&&!state.installed.dbus){state.environmentTab='packages';render();toast('请先安装 D-Bus 依赖')}
      else {state.running[id]=true;if(id==='avahi')state.running.dbus=true;render();toast('演示：'+serviceNames[id]+' 已启动'+(id==='avahi'?'，D-Bus 已就绪':''))}
    }
    else if(a==='edit-permissions')permissionsForm();
    else if(a==='create-auth')permissionsForm(true);
    else if(a==='save-permissions'){const selected=[...document.querySelectorAll('input[name="permission"]:checked')].map(i=>i.value);if(!selected.length){toast('请至少选择一项发现权限');return}permissions.forEach(p=>state.permissions[p.id]=selected.includes(p.id));state.authorized=true;renderAuth();if(b.dataset.create==='true')showSecret();else{$('modal').close();toast('演示：客户端权限已更新')}}
    else if(a==='rotate-key')confirmAction('重新生成客户端密钥？','<p>新的示例密钥将只展示一次。实际使用时，需要同步更新客户端保存的凭据。</p>','生成新密钥',showSecret);
    else if(a==='revoke')confirmAction('撤销客户端授权？','<p>撤销后，客户端需要重新获得授权才能调用发现接口。此操作仅修改演示账号的界面状态。</p>','撤销授权',()=>{state.authorized=false;renderAuth();toast('演示：客户端授权已撤销')},true);
    else if(a==='copy-api')copyText('https://192.168.31.1/ubus');
    else if(a==='copy-secret')copyText($('demo-secret').textContent);
    else if(a==='api-example')apiExample(id);
    else if(a==='copy-api-code')copyText($('api-code').textContent);
    else if(a==='export')exportDevices();
    else if(a==='reset'){const generation=state.generation+1;state=initialState();state.generation=generation;devices.forEach((d,i)=>{if(d.current)d.seen=['21:32:08','21:32:08','21:32:07','21:32:07','21:32:06','21:32:05'][i]});render();toast('已恢复初始示例状态')}
  });
  document.addEventListener('input',e=>{if(e.target.id==='device-search'){state.query=e.target.value;renderDeviceRows()}else if(e.target.id==='adb-search'){state.adbQuery=e.target.value;renderADBRows()}});
  document.addEventListener('change',e=>{if(e.target.id==='scope-filter'){state.scope=e.target.value;renderDeviceRows()}else if(e.target.id==='status-filter'){state.status=e.target.value;renderDeviceRows()}else if(e.target.id==='adb-protocol'){state.adbProtocol=e.target.value;renderADBRows()}});
  document.querySelector('.tabs').addEventListener('keydown',e=>{if(!['ArrowRight','ArrowLeft','Home','End'].includes(e.key))return;const tabs=[...document.querySelectorAll('.tab')];let idx=tabs.indexOf(document.activeElement);if(idx<0)return;e.preventDefault();idx=e.key==='Home'?0:e.key==='End'?tabs.length-1:(idx+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;setPage(tabs[idx].dataset.page);tabs[idx].focus()});
  $('modal').addEventListener('close',()=>{if(!$('modal').open){$('modal').innerHTML='';pendingAction=null}});
  $('drawer').addEventListener('close',()=>{$('drawer').innerHTML=''});
  render();
</script>
</body>
</html>
