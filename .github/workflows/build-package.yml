name: 构建 OpenWrt 软件包

on:
  workflow_dispatch:
    inputs:
      sdk_url:
        description: 与路由器固件匹配的官方 SDK HTTPS 下载地址
        required: true
        type: string
      sdk_sha256:
        description: 官方 sha256sums 中该 SDK 的 SHA256（64 位）
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: easy-discovery-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: 按固件 SDK 构建原生安装包
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: 获取项目源码
        uses: actions/checkout@v4
      - name: 准备 SDK 运行工具
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gawk gettext git libncurses-dev libssl-dev python3 rsync unzip zstd file wget curl
      - name: 下载并校验固件 SDK
        env:
          SDK_URL: ${{ inputs.sdk_url }}
          SDK_SHA256: ${{ inputs.sdk_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          case "$SDK_URL" in
            https://downloads.openwrt.org/*|https://downloads.immortalwrt.org/*) ;;
            *) echo '仅接受 OpenWrt / ImmortalWrt 官方 HTTPS SDK 地址'; exit 1 ;;
          esac
          [[ "$SDK_SHA256" =~ ^[0-9A-Fa-f]{64}$ ]] || { echo 'SDK SHA256 格式不正确'; exit 1; }
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --location --max-redirs 4 --connect-timeout 30 --retry 2 --output "$RUNNER_TEMP/sdk.archive" "$SDK_URL"
          printf '%s  %s\n' "$SDK_SHA256" "$RUNNER_TEMP/sdk.archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/easy-discovery-sdk"
          tar --extract --file "$RUNNER_TEMP/sdk.archive" --directory "$RUNNER_TEMP/easy-discovery-sdk" --strip-components=1 --no-same-owner --no-same-permissions
      - name: 构建应用安装包
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/easy-discovery-sdk"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          sh "$GITHUB_WORKSPACE/scripts/build-sdk.sh" "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find bin -type f \( -name 'luci-app-easy-discovery*.apk' -o -name 'luci-app-easy-discovery*.ipk' \) -exec cp {} "$GITHUB_WORKSPACE/dist/" \;
      - name: 上传原生软件包
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-easy-discovery-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
