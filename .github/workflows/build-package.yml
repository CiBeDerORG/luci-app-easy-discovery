name: 构建 OpenWrt 软件包

on:
  workflow_call:
    inputs:
      sdk_url:
        required: true
        type: string
      sdk_sha256:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      sdk_url:
        description: 与路由器固件匹配的官方 SDK HTTPS 下载地址
        required: true
        type: string
      sdk_sha256:
        description: 官方 sha256sums 中该 SDK 的 SHA256（64 位）
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: easy-discovery-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: 按固件 SDK 构建原生安装包
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: 获取项目源码
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 准备 SDK 运行工具
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gawk gettext git libncurses-dev libssl-dev python3 rsync unzip zstd file wget curl
      - name: 缓存已校验的 SDK 下载
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/easy-discovery-sdk-download
          key: sdk-linux-${{ inputs.sdk_sha256 }}
      - name: 下载并校验固件 SDK
        env:
          SDK_URL: ${{ inputs.sdk_url }}
          SDK_SHA256: ${{ inputs.sdk_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          case "$SDK_URL" in
            https://downloads.openwrt.org/*|https://downloads.immortalwrt.org/*) ;;
            *) echo '仅接受 OpenWrt / ImmortalWrt 官方 HTTPS SDK 地址'; exit 1 ;;
          esac
          [[ "$SDK_SHA256" =~ ^[0-9A-Fa-f]{64}$ ]] || { echo 'SDK SHA256 格式不正确'; exit 1; }
          mkdir -p "$RUNNER_TEMP/easy-discovery-sdk-download"
          SDK_ARCHIVE="$RUNNER_TEMP/easy-discovery-sdk-download/sdk.archive"
          if [ ! -f "$SDK_ARCHIVE" ]; then
            curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --location --max-redirs 4 --connect-timeout 30 --retry 2 --output "$SDK_ARCHIVE" "$SDK_URL"
          fi
          printf '%s  %s\n' "$SDK_SHA256" "$SDK_ARCHIVE" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/easy-discovery-sdk"
          tar --extract --file "$SDK_ARCHIVE" --directory "$RUNNER_TEMP/easy-discovery-sdk" --strip-components=1 --no-same-owner --no-same-permissions
      - name: 构建应用安装包
        env:
          SDK_URL: ${{ inputs.sdk_url }}
          SDK_SHA256: ${{ inputs.sdk_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/easy-discovery-sdk"
          ./scripts/feeds update -a 2>&1 | tee "$RUNNER_TEMP/easy-discovery-build.log"
          ./scripts/feeds install -a 2>&1 | tee -a "$RUNNER_TEMP/easy-discovery-build.log"
          sh "$GITHUB_WORKSPACE/scripts/build-sdk.sh" "$GITHUB_WORKSPACE" 2>&1 | tee -a "$RUNNER_TEMP/easy-discovery-build.log"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find bin -type f \( -name 'luci-app-easy-discovery*.apk' -o -name 'luci-app-easy-discovery*.ipk' \) -exec cp {} "$GITHUB_WORKSPACE/dist/" \;
          for metadata in version.buildinfo feeds.buildinfo; do
            if [ -f "$metadata" ]; then cp "$metadata" "$GITHUB_WORKSPACE/dist/"; fi
          done
          printf '%s\n' "源码提交：$GITHUB_SHA" "SDK：$SDK_URL" "SDK SHA256：$SDK_SHA256" > "$GITHUB_WORKSPACE/dist/构建信息.txt"
      - name: 上传原生软件包
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-easy-discovery-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: 保存构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: ${{ runner.temp }}/easy-discovery-build.log
          if-no-files-found: ignore
          retention-days: 14
